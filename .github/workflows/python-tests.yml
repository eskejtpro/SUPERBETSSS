name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/sw.js
          node --check chrome_bridge/content.js
          node --check chrome_bridge/background.js
          node --check chrome_bridge/popup.js
          python -m json.tool chrome_bridge/manifest.json > /dev/null
